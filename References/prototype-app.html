<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Yu Garden · Shanghainese Practice</title>
<style>
  :root{
    --ink:#2c3230; --ink-2:#5c6a66; --ink-3:#8c9994;
    --line:#e4dcc2; --line-2:#c8bc9c;
    --paper:#fffaea; --paper-2:#f2e9cd; --paper-3:#e8ddbc;
    --jade:#5a9e98; --jade-soft:#d8e8e4;
    --vermilion:#b9705a; --vermilion-soft:#f4e2d6;
    --gold:#9a8a5e;
    --sky:#cfe2de; --water:#8fbdb7;
    --r:14px; --r-sm:9px;
    --shadow:0 1px 2px rgba(44,50,48,.06), 0 8px 24px rgba(44,50,48,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, #f6eed6 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #dfeae6 0%, transparent 55%),
      var(--paper-2);
    color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}

  .wrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;padding:22px 20px 40px;flex-wrap:wrap}

  /* ================= 手机壳 ================= */
  .phone{
    width:396px;flex:none;background:var(--paper);border:1px solid var(--line);
    border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
    height:756px;position:relative;
  }
  .app-bar{
    display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
    border-bottom:1px solid var(--line);background:var(--paper);z-index:5;
  }
  .app-bar .back{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:13px;line-height:24px;text-align:center;color:var(--ink-2)}
  .app-bar .back:hover{background:var(--paper-2)}
  .app-bar h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em}
  .app-bar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:block;line-height:1.3}
  .dots{margin-left:auto;display:flex;gap:5px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block;transition:background .3s,transform .3s}
  .dots i.on{background:var(--jade);transform:scale(1.25)}
  .dots i.cur{background:var(--vermilion)}

  .screen{flex:1;overflow-y:auto;position:relative}
  .screen::-webkit-scrollbar{width:0}
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ================= 地图 ================= */
  .map-head{padding:18px 20px 6px}
  .map-head h2{margin:0;font-size:19px;letter-spacing:.02em}
  .map-head p{margin:5px 0 0;font-size:12.5px;color:var(--ink-2)}
  .mapbox{padding:6px 14px 0}
  .mapbox svg{width:100%;height:auto;display:block}
  .pin{cursor:pointer}
  .pin .halo{opacity:0;transform-origin:center}
  .pin.current .halo{opacity:1;animation:halo 2s ease-out infinite}
  @keyframes halo{0%{opacity:.5;r:11}70%{opacity:0;r:24}100%{opacity:0;r:24}}
  .pin.locked{opacity:.4;cursor:not-allowed}
  .walker{transition:transform .9s cubic-bezier(.4,.1,.2,1)}
  .ripple{animation:ripple 5s ease-in-out infinite}
  .ripple.b{animation-delay:1.6s}
  @keyframes ripple{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}

  .stoplist{padding:8px 14px 20px}
  .stoprow{
    display:flex;gap:11px;align-items:center;width:100%;text-align:left;
    padding:11px 12px;border-radius:var(--r-sm);border:1px solid transparent;transition:background .2s;
  }
  .stoprow:hover{background:var(--paper-2)}
  .stoprow[aria-current="true"]{background:var(--paper-2);border-color:var(--line-2)}
  .stoprow .num{
    flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);
    font-size:11.5px;line-height:22px;text-align:center;color:var(--ink-3);background:var(--paper);
  }
  .stoprow.done .num{background:var(--jade);border-color:var(--jade);color:#fff}
  .stoprow[aria-current="true"] .num{border-color:var(--vermilion);color:var(--vermilion)}
  .stoprow .t{font-size:13.5px;font-weight:600}
  .stoprow .s{font-size:11.5px;color:var(--ink-3)}
  .stoprow .go{margin-left:auto;color:var(--ink-3);font-size:13px}
  .stoprow.locked{opacity:.45;pointer-events:none}

  /* ================= 场景 ================= */
  .scene{position:relative;background:linear-gradient(180deg,var(--sky) 0%,#e9f0ef 65%,var(--paper) 100%)}
  .scene svg{width:100%;height:auto;display:block}
  .steam{animation:steam 3.4s ease-in-out infinite;transform-origin:bottom center}
  .steam.b{animation-delay:.9s} .steam.c{animation-delay:1.8s}
  @keyframes steam{0%{opacity:0;transform:translateY(4px) scaleX(.8)}35%{opacity:.55}100%{opacity:0;transform:translateY(-22px) scaleX(1.3)}}
  .lantern{animation:sway 4.6s ease-in-out infinite;transform-origin:top center}
  .lantern.b{animation-delay:.7s}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  .glow{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}

  .task-strip{padding:13px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
  .task-strip .lbl{font-size:11px;color:var(--vermilion);letter-spacing:.08em;font-weight:600}
  .task-strip p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);
    border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--ink-3);background:var(--paper);
    transition:all .3s;
  }
  .chip b{color:var(--ink)}
  .chip.set{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
  .chip.set b{color:var(--jade)}
  .chip.pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}

  .chat{padding:14px 16px 6px;display:flex;flex-direction:column;gap:11px}
  .msg{display:flex;gap:8px;max-width:88%;animation:rise .32s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg .av{
    flex:none;width:27px;height:27px;border-radius:50%;font-size:11px;line-height:26px;text-align:center;
    background:var(--paper-3);color:var(--ink-2);border:1px solid var(--line)
  }
  .msg.me .av{background:var(--jade);border-color:var(--jade);color:#fff}
  .bub{background:var(--paper-2);border:1px solid var(--line);border-radius:13px;border-top-left-radius:4px;padding:8px 11px}
  .msg.me .bub{background:var(--jade-soft);border-color:#bcd9d3;border-radius:13px;border-top-right-radius:4px}
  .bub .sh{font-size:14px;font-weight:600;letter-spacing:.01em}
  .bub .roman{display:block;font-size:11.5px;color:var(--jade);margin-top:3px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
  .bub .en-gloss{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;font-style:italic}
  .bub .gl{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .bub .sys{display:block;font-size:10.5px;color:var(--ink-3);margin-top:5px;font-family:ui-monospace,Menlo,monospace}
  .msg.note .bub{background:var(--vermilion-soft);border-color:#e8cdbc;color:var(--vermilion);font-size:12.5px}
  .typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-right:3px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .done-card{
    margin:12px 16px 6px;background:var(--jade-soft);border:1px solid #bcd9d3;border-radius:var(--r);
    padding:13px 14px;animation:rise .4s ease both;
  }
  .done-card h3{margin:0 0 4px;font-size:14px;color:var(--jade)}
  .done-card p{margin:0;font-size:12px;color:var(--ink-2)}
  .done-card .btn{margin-top:10px;width:100%}

  /* ================= 输入区 ================= */
  .dock{border-top:1px solid var(--line);background:var(--paper);padding:10px 14px 14px}
  .quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px}
  .quick::-webkit-scrollbar{height:0}
  .qbtn{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2);background:var(--paper);white-space:nowrap}
  .qbtn:hover{background:var(--paper-2)}
  .qbtn.card{border-style:dashed;color:var(--jade);border-color:#a9cfc8}
  .inputrow{display:flex;gap:9px;align-items:flex-end}
  .inputrow textarea{
    flex:1;min-height:42px;max-height:96px;resize:none;border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:10px 12px;font-size:13.5px;background:var(--paper);line-height:1.45;
  }
  .mic{
    flex:none;width:46px;height:46px;border-radius:50%;background:var(--vermilion);color:#fff;
    font-size:19px;box-shadow:0 3px 10px rgba(185,112,90,.28);transition:transform .15s;
  }
  .mic:hover{transform:scale(1.05)}
  .mic.rec{animation:recpulse 1.1s ease-in-out infinite}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(185,112,90,.45)}50%{box-shadow:0 0 0 12px rgba(185,112,90,0)}}
  .send{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-2);font-size:16px}
  .send:hover{background:var(--paper-2)}
  .mic:disabled,.send:disabled,.qbtn:disabled{opacity:.4;cursor:not-allowed}
  .wave{display:flex;gap:3px;align-items:center;justify-content:center;height:22px;margin-bottom:6px}
  .wave i{width:3px;background:var(--vermilion);border-radius:2px;animation:wv .7s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.1s} .wave i:nth-child(3){animation-delay:.2s}
  .wave i:nth-child(4){animation-delay:.3s} .wave i:nth-child(5){animation-delay:.15s}
  .wave i:nth-child(6){animation-delay:.05s} .wave i:nth-child(7){animation-delay:.25s}
  @keyframes wv{0%,100%{height:5px}50%{height:19px}}
  .hidden{display:none !important}

  .btn{
    border:1px solid var(--line-2);border-radius:999px;padding:7px 15px;font-size:12.5px;
    color:var(--ink-2);background:var(--paper);white-space:nowrap;
  }
  .btn:hover{background:var(--paper-2)}
  .btn.primary{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
  .btn.primary:hover{background:#48908a}

  /* ================= 底部抽屉 ================= */
  .sheet-bg{position:absolute;inset:0;background:rgba(44,50,48,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:9;
    border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(44,50,48,.16);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);
    max-height:74%;display:flex;flex-direction:column;
  }
  .sheet.on{transform:none}
  .sheet-h{display:flex;align-items:center;padding:14px 16px 8px}
  .sheet-h h3{margin:0;font-size:14px}
  .sheet-h .x{margin-left:auto;color:var(--ink-3);font-size:16px}
  .sheet-b{overflow-y:auto;padding:4px 16px 18px}
  .ecard{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:9px;background:var(--paper)}
  .ecard .sh{font-size:16px;font-weight:650}
  .ecard .rm{font-size:11.5px;color:var(--gold);font-family:ui-monospace,Menlo,monospace}
  .ecard .gl{font-size:12px;color:var(--ink-2);margin-top:3px}
  .ecard .acts{display:flex;gap:6px;margin-top:9px}
  .mini{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--ink-2)}
  .mini:hover{background:var(--paper-2)}
  .mini.playing{background:var(--vermilion-soft);border-color:#e8cdbc;color:var(--vermilion)}

  /* ================= 评测台 ================= */
  .dev{width:392px;flex:none;display:flex;flex-direction:column;gap:14px}
  @media (max-width:880px){ .dev{width:396px} }
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-3);letter-spacing:.05em}
  .panel-h .n{margin-left:auto}
  .panel-h .tg{color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
  .panel-b{padding:13px 14px}
  .drow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .drow label{flex:0 0 74px;font-size:11.5px;color:var(--ink-3)}
  .drow select{flex:1;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 8px;font-size:12.5px;background:var(--paper)}
  .dnote{font-size:11px;color:var(--ink-3);margin:2px 0 0}
  .console{max-height:330px;overflow:auto;padding:9px 12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.55}
  .lg{padding:4px 0;border-bottom:1px dashed var(--line)}
  .lg:last-child{border-bottom:none}
  .lg .k{color:var(--ink-3)}
  .lg .ev{color:var(--jade);font-weight:700}
  .lg .bad{color:var(--vermilion);font-weight:700}
  .empty{color:var(--ink-3);font-size:12px;padding:6px 0}
  .banner{font-size:11.5px;color:var(--ink-3);padding:0 2px}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
  }
  .toast.on{opacity:.95}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  /* ================= 页面顶栏 ================= */
  .page-bar{
    display:flex;align-items:center;justify-content:flex-end;
    padding:10px 18px 6px;gap:8px;
  }
  .lang-sw{
    display:flex;gap:3px;background:#fff;border:1px solid var(--line-2);
    border-radius:999px;padding:3px;
  }
  .lang-sw button{
    padding:4px 13px;border-radius:999px;font-size:12px;color:var(--ink-2);
    transition:background .15s,color .15s;
  }
  .lang-sw button[aria-selected="true"]{background:var(--jade);color:#fff;font-weight:600}
</style>
</head>
<body>

<div class="page-bar">
  <div class="lang-sw" id="pageLang" role="tablist" aria-label="Language">
    <button role="tab" data-lang="zh" aria-selected="false">中文</button>
    <button role="tab" data-lang="en" aria-selected="true">EN</button>
  </div>
</div>

<div class="wrap">
  <!-- ======================= APP ======================= -->
  <div class="phone">
    <div class="app-bar">
      <button class="back hidden" id="back" aria-label="返回地图">‹</button>
      <div>
        <h1 id="barTitle">虚拟豫园</h1>
        <span class="sub" id="barSub">上海话入门 · 四站路线</span>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="screen" id="screen"></div>

    <div class="dock hidden" id="dock">
      <div class="wave hidden" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="quick" id="quick"></div>
      <div class="inputrow">
        <textarea id="say" rows="1" placeholder="Respond in Shanghainese…"></textarea>
        <button class="send" id="sendText" title="文本提交">⌨</button>
        <button class="mic" id="mic" title="语音提交（模拟 ASR）">🎤</button>
      </div>
    </div>

    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-h"><h3 id="sheetTitle">Expression Cards</h3><button class="x" id="sheetX">✕</button></div>
      <div class="sheet-b" id="sheetB"></div>
    </div>
  </div>

  <!-- ======================= 评测台 ======================= -->
  <div class="dev">
    <p class="banner" id="devBanner"></p>

    <div class="panel">
      <div class="panel-h" id="devPanelH">Dev Panel <span class="n"><button class="tg" id="devTg">Collapse</button></span></div>
      <div class="panel-b" id="devB">
        <div class="drow"><label id="asrLabel" for="asrModel">ASR model</label>
          <select id="asrModel">
            <option value="whisper-medium">whisper-medium</option>
            <option value="whisper-medium-wu" selected>whisper-medium-wu</option>
            <option value="qwen3-asr-1.7b">qwen3-asr-1.7b</option>
          </select></div>
        <div class="drow"><label id="injectLabel" for="inject">Error injection</label>
          <select id="inject">
            <option value="none" id="injectNone">None (correct transcript)</option>
            <option value="quantity" id="injectQty">Quantity mishear → 200</option>
            <option value="drop" id="injectDrop">Drop last field</option>
            <option value="garble" id="injectGarble">Garbled (no parse)</option>
          </select></div>
        <div class="drow"><label id="audioLabel" for="showAudio">Audio text</label>
          <select id="showAudio">
            <option value="hide" id="audioHide" selected>Hide (normal listening task)</option>
            <option value="show" id="audioShow">Show (debug)</option>
          </select></div>
        <div class="drow" style="margin-bottom:0">
          <label id="sessionLabel">Session</label>
          <button class="btn" id="exportBtn" style="flex:1">Export JSONL</button>
          <button class="btn" id="resetBtn">Reset</button>
        </div>
        <p class="dnote" id="devNote"></p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h" id="logPanelH">Log <span class="n" id="logCount"></span></div>
      <div class="console" id="console"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =======================================================================
   0. 语言包
   ======================================================================= */
let LANG = 'en';
const L = {
  zh:{
    docTitle:"虚拟豫园 · 上海话练习",
    appTitle:"虚拟豫园", appSub:"上海话入门 · 四站路线",
    mapTitle:"豫园 · 四站路线", mapSub:(done)=>`20–30 分钟，8–12 条核心表达。已完成 ${done} / 4。`,
    taskLabel:"任务", listenBtn:"▶ 听店家介绍", listenPlayed:(n)=>`▶ 听店家介绍 · ${n}`,
    listenDone:"（已播放 · 预生成音频占位）", listenShow:(t)=>`（音频文本）${t}`,
    listenToast:"预生成音频占位 · 已记 audio_play",
    cardBtn:(n)=>`📇 表达卡 ${n}`, skipBtn:"跳过（assist）",
    sheetTitle:"表达卡",
    doneTitle:"本站完成", skipTitle:"已跳过本站",
    doneStat:(s)=>`耗时 ${s.elapsed}s · retries ${s.retries} · clarify ${s.clarifies}`,
    nextBtn:(name)=>`走去下一站：${name} →`, backMapBtn:"回到地图 · 查看总结",
    summaryTitle:"路线完成",
    summaryStat:(d,a,r,co,au,sw)=>`总耗时 ${d}s · 自主完成 ${a}/4 · assist — · retries ${r} · 查卡 ${co} · 音频 ${au} · 通道切换 ${sw}`,
    exportBtn:"导出本场日志",
    devTitle:"评测台", devCollapse:"收起", devExpand:"展开",
    asrLabel:"ASR 模型", injectLabel:"错误注入", audioLabel:"音频文本",
    injectNone:"无（转写正确）", injectQty:"数量听错 → 200", injectDrop:"漏掉最后一个字段", injectGarble:"整句没听清",
    audioHide:"隐藏（正常听力任务）", audioShow:"显示（调试用）",
    sessionLabel:"会话", exportBtnDev:"导出 JSONL", resetBtn:"重置",
    devNote:"错误注入只作用于语音通道。延迟为各模型占位值，语音提交会真的等这么久。",
    logTitle:"日志", logCount:(n)=>`${n} 条`,
    emptyLog:"暂无记录。",

/* =======================================================================
   3. 抽取（模拟 LLM）/ 校验（确定性）
   ======================================================================= */
const NUM = { "一":1,"两":2,"二":2,"俩":2,"三":3,"四":4,"五":5 };

function extract(station, text, ctx){
  const t = String(text||""), f = {}, has = re => re.test(t);
  if(station.fields.includes("preference")){
    if(has(/勿吃辣|不吃辣|veq chiq laq|no.?spicy|not spicy|不要辣|勿要辣/i)) f.preference="non_spicy";
    else if(has(/要辣|喜欢辣|spicy/i)) f.preference="spicy";
  }
  if(station.id==="old_restaurant"){
    const dish = MENU.find(m=>t.includes(m.name));
    if(dish) f.item = dish.id;
    else if(has(/搿个|这个|就要伊|that one|this one/i) && ctx.recommended) f.item = ctx.recommended;
    if(has(/推荐|啥好吃|recommend/i) && !dish) f.askRecommend = true;
  }
  if(station.fields.includes("flavor")){
    if(has(/玫瑰|rose/i)) f.flavor="rose";
    else if(has(/薄荷|mint/i)) f.flavor="mint";
    else if(has(/桂花|osmanthus/i)) f.flavor="osmanthus";
  }
  if(station.id==="pear_candy_shop" && has(/梨膏糖|梨膏|candy|糖/i)) f.item="pear_candy";
  if(station.id==="nanxiang" && has(/小笼包|小笼|xiaolongbao|xlb|包子/i)) f.item="xiaolongbao";
  if(station.fields.includes("quantity")){
    const cn = t.match(/([一两二俩三四五])\s*(包|笼|份|个)/), dg = t.match(/(\d+)\s*(包|笼|份|个)?/);
    if(cn) f.quantity = NUM[cn[1]]; else if(dg) f.quantity = parseInt(dg[1],10);
  }
  if(station.fields.includes("takeaway")){
    if(has(/打包|带走|外带|takeaway|to.?go/i)) f.takeaway=true;
    else if(has(/堂吃|里向吃|这里吃|dine.?in/i)) f.takeaway=false;
  }
  if(station.fields.includes("praise") && has(/好吃|好喝|老好|不错|香|good|tasty|nice/i)) f.praise=true;
  if(station.fields.includes("thanks") && has(/谢谢|多谢|谢侬|zia zia|thank/i)) f.thanks=true;
  if(has(/^(对|对个|是|是个|好|好个|嗯|ok|yes|right)[。.!！]?$/i)) f.affirm=true;
  return f;
}

function validate(station, field, value){
  if(field==="quantity" && (!Number.isInteger(value) || value<1 || value>5))
    return { ok:false, reason:"quantity_out_of_range", allowed:[1,5] };
  if(field==="item" && station.id==="old_restaurant"){
    const d = MENU.find(m=>m.id===value);
    if(!d) return { ok:false, reason:"item_not_on_menu" };
    if(d.spicy) return { ok:false, reason:"item_is_spicy" };
  }
  if(field==="flavor" && station.audio && value!==station.audio.target)
    return { ok:false, reason:"flavor_mismatch" };
  return { ok:true };
}

/* =======================================================================
   4. 会话状态
   ======================================================================= */
const MODEL_LATENCY = { "whisper-medium":1610, "whisper-medium-wu":1240, "qwen3-asr-1.7b":900 };
const SESSION = "proto_" + Math.random().toString(36).slice(2,8);
let S, busy = false;

function fresh(){
  return {
    view:"map", stop:0, turn:0, logs:[], startedAt:Date.now(), walkXY:STATIONS[0].xy.slice(),
    stops: STATIONS.map(()=>({ fields:{}, state:"collecting", retries:0, clarifies:0,
      assist:false, done:false, chat:[], recommended:null, audioPlayed:0, elapsed:0, startedAt:null })),
    cardOpens:0, audioPlays:0, switches:0, lastChannel:null, justSet:[],
  };
}
const $ = s => document.querySelector(s);
const t = () => L[LANG];
const cur = () => STATIONS[S.stop];
const curS = () => S.stops[S.stop];
// tx: for UI labels that vary zh/en
const tx = (obj) => (obj && typeof obj === 'object') ? (obj[LANG] || obj.en || obj.zh || '') : (obj || '');
// txD: for dialogue objects — always return Shanghainese text, but carry roman+en for bubble rendering
const txD = (obj) => {
  if (!obj || typeof obj !== 'object') return { sh: obj || '', roman: '', en: '' };
  if (obj.sh !== undefined) return obj; // {sh, roman, en} shape
  // legacy {zh, en} shape — treat zh as sh
  return { sh: obj.zh || obj.en || '', roman: '', en: obj.en || '' };
};
const sleep = ms => new Promise(r=>setTimeout(r, ms));

function log(event, extra){
  S.logs.push(Object.assign({ ts:new Date().toISOString(), session:SESSION,
    station:cur().id, turn:S.turn, event }, extra||{}));
  renderConsole();
}
function toast(m){
  const el=$("#toast"); el.textContent=m; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1600);
}
function push(who, text, gl, sys, kind, roman, enGloss){ curS().chat.push({who,text,gl,sys,kind,roman,enGloss}); }
function pushD(who, dialogueObj, sys, kind){
  const d = txD(dialogueObj);
  push(who, d.sh, null, sys, kind, d.roman, d.en);
}

/* =======================================================================
   5. 状态机
   ======================================================================= */
const missingFields = () => cur().fields.filter(f => curS().fields[f]===undefined);

async function submit(channel, rawText, pField, pValue){
  const st = cur(), ss = curS();
  if(ss.done || busy) return;
  if(!ss.startedAt) ss.startedAt = Date.now();
  busy = true; S.turn++;

  if(S.lastChannel && S.lastChannel!==channel){ S.switches++; log("input_switch",{from:S.lastChannel,to:channel}); }
  S.lastChannel = channel;

  let transcript = rawText, model=null, latency=null, injected="none", fields;

  if(channel==="button"){
    fields = { [pField]: pValue };
    transcript = `[button] ${pField}=${pValue}`;
    push("me", `${pField} = ${pValue}`, null, t().buttonChannel);
    renderScene();
  } else if(channel==="speech"){
    model = $("#asrModel").value; latency = MODEL_LATENCY[model]; injected = $("#inject").value;
    $("#wave").classList.remove("hidden"); $("#mic").classList.add("rec");
    await sleep(750);
    $("#wave").classList.add("hidden"); $("#mic").classList.remove("rec");
    push("me", rawText, null, t().recognizing(model)); renderScene();
    await sleep(latency);
    transcript = injectError(rawText, injected, st);
    ss.chat[ss.chat.length-1].gl = transcript!==rawText ? t().recognizedAs(transcript) : null;
    ss.chat[ss.chat.length-1].sys = `${model} · ${latency}ms`;
    renderScene();
    fields = extract(st, transcript, { recommended: ss.recommended });
  } else {
    push("me", rawText, null, t().textChannel); renderScene();
    fields = extract(st, transcript, { recommended: ss.recommended });
  }

  log("input", { channel, model, latency_ms:latency, injected, raw:rawText||null,
                 transcript, extracted:Object.assign({},fields) });

  await typing();

  if(fields.askRecommend && !ss.fields.item){
    const pick = MENU.find(m=>!m.spicy);
    ss.recommended = pick.id;
    const recD = { sh:`搿么推荐侬${pick.name}，一点勿辣个。`, roman:`Geq meq tsoe tsoe nong ${pick.name}, iq tiq veq laq gheq.`, en:`We recommend ${pick.name} — not spicy at all.` };
    pushD("shop", recD, "state: collecting");
    log("action",{ next_action:"recommend", value:pick.id, state:ss.state });
    busy=false; return renderScene();
  }

  let rejected = null; S.justSet = [];
  Object.keys(fields).forEach(k=>{
    if(!st.fields.includes(k)) return;
    const v = validate(st,k,fields[k]);
    if(v.ok){ if(ss.fields[k]!==fields[k]) S.justSet.push(k); ss.fields[k]=fields[k]; }
    else rejected = Object.assign({ field:k, value:fields[k] }, v);
  });

  if(rejected){
    log("validation_rejected", rejected); ss.retries++;
    const rejMap = {
      item_is_spicy:      { sh:"搿只菜是辣个哦，换一只好伐？",    roman:"Geq zeq tsai zeq laq gheq oh, wueh iq zeq hau vaq?",    en:"That dish is spicy — try another one?" },
      quantity_out_of_range:{ sh:"几包？再讲一遍好伐？",          roman:"Ji pau? Zae kang iq bian hau vaq?",                      en:"How many packs? Say that again?" },
      flavor_mismatch:    { sh:"勿是搿只味道，再听一遍好伐？",    roman:"Veq zeq geq zeq vi dau, zae ting iq bian hau vaq?",    en:"That's not the right flavor — listen again?" },
    };
    const rejD = rejMap[rejected.reason] || { sh:"阿拉没搿只，换一只好伐？", roman:"Ala meq geq zeq, wueh iq zeq hau vaq?", en:"We don't have that — try something else?" };
    pushD("shop", rejD, `rejected: ${rejected.reason}`);
    busy=false; return renderScene();
  }

  if(ss.state==="confirming"){
    if(fields.affirm){ busy=false; return finishStop(); }
    if(Object.keys(fields).some(k=>st.fields.includes(k))){
      ss.state="collecting"; log("correction",{ fields:Object.assign({},ss.fields) });
    }
  }

  const missing = missingFields();
  if(missing.length){
    ss.state="collecting"; ss.clarifies++;
    if(!Object.keys(fields).length) ss.retries++;
    const clarifyD = st.clarify[missing[0]] || { sh:"再讲一遍好伐？", roman:"Zae kang iq bian hau vaq?", en:"Could you say that again?" };
    pushD("shop", clarifyD, `clarify: ${missing[0]}`);
    log("action",{ next_action:"clarify", missing, state:"collecting" });
  } else if(st.confirm && ss.state!=="confirming"){
    ss.state="confirming";
    const confirmZh = st.confirmText.zh(ss.fields);
    const confirmEn = st.confirmText.en(ss.fields);
    push("shop", confirmZh, null, t().confirmHint, null, "", confirmEn);
    log("action",{ next_action:"confirm", fields:Object.assign({},ss.fields), state:"confirming" });
  } else { busy=false; return finishStop(); }

  busy=false; renderScene();
}

async function typing(){
  const ss = curS();
  ss.chat.push({ who:"shop", typing:true }); renderScene();
  await sleep(520);
  ss.chat.pop();
}

function injectError(text, mode, st){
  if(mode==="none") return text;
  if(mode==="garble") return "……";
  if(mode==="quantity") return String(text).replace(/([一两二俩三四五]|\d+)\s*(包|笼|份|个)?/, "200");
  if(mode==="drop"){
    const last = st.fields[st.fields.length-1];
    if(last==="takeaway") return String(text).replace(/打包|带走|外带/g,"");
    if(last==="quantity") return String(text).replace(/([一两二俩三四五]|\d+)\s*(包|笼|份)?/g,"");
    return String(text).split(/[，,。\s]/)[0];
  }
  return text;
}

function finishStop(){
  const st=cur(), ss=curS();
  ss.state="completed"; ss.done=true;
  ss.elapsed = Math.round((Date.now()-(ss.startedAt||Date.now()))/1000);
  pushD("shop", st.doneText, "state: completed");
  log("completed",{ fields:Object.assign({},ss.fields), criteria_met:true,
    retries:ss.retries, clarifications:ss.clarifies, assist:ss.assist, elapsed_s:ss.elapsed });
  renderAll();
}

function skipStop(){
  const ss=curS();
  ss.assist=true; ss.done=true; ss.state="completed";
  ss.elapsed = Math.round((Date.now()-(ss.startedAt||Date.now()))/1000);
  push("shop", LANG==='zh'?"（主持人协助，跳过本站）":"(Facilitator assist — stop skipped)", null, "assist: true", "note");
  log("completed",{ criteria_met:false, assist:true, retries:ss.retries,
    fields:Object.assign({},ss.fields), elapsed_s:ss.elapsed });
  renderAll();
}

function enterStop(i){
  if(i>0 && !S.stops[i-1].done) return;
  S.stop=i; S.view="stop";
  const ss=curS();
  if(!ss.chat.length){ pushD("shop", cur().open, "state: collecting"); ss.startedAt=Date.now(); }
  log("enter_station",{ index:i });
  renderAll();
}

function toMap(nextIndex){
  S.view="map"; renderAll();
  if(nextIndex!==undefined && STATIONS[nextIndex]){
    setTimeout(()=>{ S.walkXY = STATIONS[nextIndex].xy.slice(); renderMap(); }, 60);
  }
}

/* =======================================================================
   6. 渲染
   ======================================================================= */
function renderBar(){
  const onMap = S.view==="map";
  $("#back").classList.toggle("hidden", onMap);
  $("#barTitle").textContent = onMap ? t().appTitle : tx(cur().name);
  $("#barSub").textContent = onMap ? t().appSub : tx(cur().sub);
  $("#dots").innerHTML = STATIONS.map((_,i)=>
    `<i class="${S.stops[i].done?"on":""} ${!onMap && i===S.stop?"cur":""}"></i>`).join("");
  $("#dock").classList.toggle("hidden", onMap || curS().done);
}

function renderMap(){
  const done = S.stops.filter(s=>s.done).length;
  $("#screen").innerHTML = `<div class="fade">
    <div class="map-head"><h2>${t().mapTitle}</h2>
      <p>${t().mapSub(done)}</p></div>
    <div class="mapbox">${mapSVG()}</div>
    <div class="stoplist">${STATIONS.map((st,i)=>{
      const ss=S.stops[i], locked = i>0 && !S.stops[i-1].done;
      return `<button class="stoprow ${ss.done?"done":""} ${locked?"locked":""}" data-stop="${i}"
        ${i===S.stop?'aria-current="true"':""}>
        <span class="num">${ss.done?"✓":i+1}</span>
        <span><span class="t">${tx(st.name)}</span><br><span class="s">${tx(st.sub)}${ss.assist?" · assist":""}${ss.done?` · ${ss.elapsed}s`:""}</span></span>
        <span class="go">${locked?t().lockIcon:"›"}</span></button>`;
    }).join("")}</div>
    ${done===4 ? summaryHTML() : ""}
  </div>`;
  $("#screen").querySelectorAll("[data-stop]").forEach(b=> b.onclick = ()=>enterStop(+b.dataset.stop));
  $("#screen").querySelectorAll("[data-pin]").forEach(g=>{
    g.onclick = ()=>{ if(!g.classList.contains("locked")) enterStop(+g.dataset.pin); };
  });
  if($("#exp2")) $("#exp2").onclick = exportLogs;
}

function renderScene(){
  const st=cur(), ss=curS();
  const listenBtnTxt = ss.audioPlayed ? t().listenPlayed(ss.audioPlayed) : t().listenBtn;
  const audioBtn = st.audio ? `<button class="mini" id="playAudio" style="margin-top:8px">${listenBtnTxt}</button>
    <span style="font-size:11px;color:var(--ink-3);margin-left:7px" id="audioText"></span>` : "";
  const meAv = LANG==='zh'?'我':'Me', shopAv = LANG==='zh'?'店':'Shop';

  $("#screen").innerHTML = `
    <div class="scene">${SCENES[st.id]}</div>
    <div class="task-strip">
      <span class="lbl">${t().taskLabel}</span>
      <p>${tx(st.brief)}</p>${audioBtn}
      <div class="chips">${st.fields.map(f=>{
        const v = ss.fields[f];
        const shown = v===undefined ? "—"
          : (f==="item" && st.id==="old_restaurant" ? (MENU.find(m=>m.id===v)||{}).name : String(v));
        return `<span class="chip ${v!==undefined?"set":""} ${S.justSet.includes(f)?"pop":""}">${st.labels[LANG][f]} <b>${shown}</b></span>`;
      }).join("")}
      <span class="chip">${t().stateLabel} <b>${ss.state}</b></span>
      <span class="chip">${t().retriesLabel} <b>${ss.retries}</b></span></div>
    </div>
    <div class="chat" id="chat">${ss.chat.map(m=>{
      if(m.typing) return `<div class="msg"><span class="av">${shopAv}</span><span class="bub typing"><span></span><span></span><span></span></span></div>`;
      const showAnnotations = m.who === 'shop' && LANG === 'en';
      return `<div class="msg ${m.who==="me"?"me":""} ${m.kind==="note"?"note":""}">
        <span class="av">${m.who==="me"?meAv:shopAv}</span>
        <span class="bub"><span class="sh">${m.text}</span>
          ${showAnnotations && m.roman ? `<span class="roman">${m.roman}</span>` : ""}
          ${showAnnotations && m.enGloss ? `<span class="en-gloss">${m.enGloss}</span>` : ""}
          ${m.gl?`<span class="gl">${m.gl}</span>`:""}
          ${m.sys?`<span class="sys">${m.sys}</span>`:""}</span></div>`;
    }).join("")}</div>
    ${ss.done ? doneCardHTML() : ""}`;

  $("#screen").scrollTop = $("#screen").scrollHeight;

  $("#quick").innerHTML =
    `<button class="qbtn card" id="openCards">${t().cardBtn(st.cards.length)}</button>` +
    st.presets.map((p,i)=>`<button class="qbtn" data-preset="${i}">${tx(p.label)}</button>`).join("") +
    `<button class="qbtn" id="assistBtn">${t().skipBtn}</button>`;
  $("#quick").querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick = ()=>{ const p = st.presets[+b.dataset.preset]; submit("button", null, p.field, p.value); };
  });
  $("#openCards").onclick = openSheet;
  $("#assistBtn").onclick = skipStop;

  if($("#playAudio")) $("#playAudio").onclick = ()=>{
    const s=curS(); s.audioPlayed++; S.audioPlays++;
    log("audio_play",{ clip:`${st.id}_intro`, count:s.audioPlayed, source:"pre-generated (placeholder)" });
    $("#audioText").textContent = $("#showAudio").value==="show"
      ? t().listenShow(tx(st.audio.text)) : t().listenDone;
    $("#playAudio").textContent = t().listenPlayed(s.audioPlayed);
    toast(t().listenToast);
  };
  $("#say").placeholder = t().placeholder;
  if($("#nextBtn")) $("#nextBtn").onclick = ()=>toMap(S.stop+1);
  if($("#backMap")) $("#backMap").onclick = ()=>toMap();
}

function doneCardHTML(){
  const ss=curS(), all = S.stops.every(s=>s.done), next = S.stop+1;
  return `<div class="done-card"><h3>${ss.assist?t().skipTitle:t().doneTitle}</h3>
    <p>${t().doneStat(ss)}</p>
    <button class="btn primary" id="${all?"backMap":"nextBtn"}">
      ${all ? t().backMapBtn : t().nextBtn(tx(STATIONS[next].name))}</button></div>`;
}

function summaryHTML(){
  const total = Math.round((Date.now()-S.startedAt)/1000);
  const assists = S.stops.filter(s=>s.assist).length;
  const retries = S.stops.reduce((a,s)=>a+s.retries,0);
  const indep = S.stops.filter(s=>s.done&&!s.assist).length;
  return `<div class="done-card" style="margin:0 14px 22px"><h3>${t().summaryTitle}</h3>
    <p>${t().summaryStat(total,indep,retries,S.cardOpens,S.audioPlays,S.switches)}</p>
    <button class="btn primary" id="exp2">${t().exportBtn}</button></div>`;
}

function openSheet(){
  const st=cur();
  $("#sheetB").innerHTML = st.cards.map(id=>{
    const e=EXPR[id];
    return `<div class="ecard"><div class="sh">${e.sh}</div><div class="rm">${e.roman}</div>
      <div class="gl">${e.zh} · ${e.en}</div>
      <div class="acts">
        <button class="mini" data-play="${id}" data-speed="normal">${t().speedNormal}</button>
        <button class="mini" data-play="${id}" data-speed="slow">${t().speedSlow}</button>
        <button class="mini" data-fill="${id}">${t().fillBtn}</button>
      </div></div>`;
  }).join("");
  $("#sheetB").querySelectorAll("[data-play]").forEach(b=>{
    b.onclick = async ()=>{
      S.audioPlays++; log("card_audio",{ card:b.dataset.play, speed:b.dataset.speed });
      b.classList.add("playing"); await sleep(b.dataset.speed==="slow"?1100:700); b.classList.remove("playing");
    };
  });
  $("#sheetB").querySelectorAll("[data-fill]").forEach(b=>{
    b.onclick = ()=>{ S.cardOpens++; log("card_open",{ card:b.dataset.fill });
      $("#say").value = EXPR[b.dataset.fill].sh; closeSheet(); $("#say").focus(); };
  });
  $("#sheetTitle").textContent = t().sheetTitle;
  $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on");
  S.cardOpens++; log("card_sheet_open",{ cards:st.cards.length });
}
function closeSheet(){ $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); }

function renderConsole(){
  $("#logCount").textContent = t().logCount(S.logs.length);
  $("#console").innerHTML = S.logs.slice(-60).reverse().map(l=>{
    const cls = l.event==="completed" ? "ev" : (l.event==="validation_rejected" ? "bad" : "ev");
    const rest = Object.keys(l).filter(k=>!["ts","session","station","turn","event"].includes(k))
      .map(k=>`<span class="k">${k}=</span>${typeof l[k]==="object"?JSON.stringify(l[k]):l[k]}`).join(" ");
    return `<div class="lg"><span class="k">${l.ts.slice(11,19)}</span> <span class="${cls}">${l.event}</span>
      <span class="k">${l.station}#${l.turn}</span> ${rest}</div>`;
  }).join("") || `<p class="empty">${t().emptyLog}</p>`;
}

function renderAll(){
  renderBar();
  if(S.view==="map") renderMap(); else renderScene();
  renderConsole();
}

/* =======================================================================
   7. 事件
   ======================================================================= */
function send(channel){
  const v = $("#say").value.trim();
  if(!v){ toast(channel==="speech" ? t().toastSpeech : t().toastText); return; }
  $("#say").value = "";
  submit(channel, v);
}
$("#mic").onclick = ()=>send("speech");
$("#sendText").onclick = ()=>send("text");
$("#say").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send("speech"); }});
$("#back").onclick = ()=>toMap();
$("#sheetX").onclick = closeSheet;
$("#sheetBg").onclick = closeSheet;
function exportLogs(){
  const blob = new Blob([S.logs.map(l=>JSON.stringify(l)).join("\n")],{type:"application/x-ndjson"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${SESSION}.jsonl`; a.click();
  URL.revokeObjectURL(a.href); toast(t().toastExport(S.logs.length));
}
$("#exportBtn").onclick = exportLogs;
$("#resetBtn").onclick = ()=>{ S = fresh(); renderAll(); toast(t().toastReset); };

function renderDevPanel(){
  const l = t();
  $("#devBanner").textContent = l.banner;
  const ph = $("#devPanelH"); if(ph) ph.firstChild.textContent = l.devTitle + " ";
  const lg = $("#logPanelH"); if(lg) lg.firstChild.textContent = l.logTitle + " ";
  const dtg = $("#devTg"); if(dtg) dtg.textContent = $("#devB").classList.contains("hidden") ? l.devExpand : l.devCollapse;
  const set = (id, v) => { const el=$(id); if(el) el.textContent = v; };
  set("#asrLabel", l.asrLabel); set("#injectLabel", l.injectLabel); set("#audioLabel", l.audioLabel);
  set("#injectNone", l.injectNone); set("#injectQty", l.injectQty);
  set("#injectDrop", l.injectDrop); set("#injectGarble", l.injectGarble);
  set("#audioHide", l.audioHide); set("#audioShow", l.audioShow);
  set("#sessionLabel", l.sessionLabel); set("#exportBtn", l.exportBtnDev); set("#resetBtn", l.resetBtn);
  set("#devNote", l.devNote);
}

function setLang(next){
  LANG = next;
  document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
  document.title = t().docTitle;
  $("#pageLang").querySelectorAll("[data-lang]").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.lang === next);
  });
  renderDevPanel();
  renderAll();
}

$("#pageLang").querySelectorAll("[data-lang]").forEach(b=>{
  b.onclick = ()=> setLang(b.dataset.lang);
});

$("#devTg").onclick = ()=>{
  const b = $("#devB"), hid = b.classList.toggle("hidden");
  $("#devTg").textContent = hid ? t().devExpand : t().devCollapse;
};

S = fresh();
