name: Deploy production
run-name: Deploy ${{ github.event.client_payload.sha || inputs.sha || github.sha }}

on:
  repository_dispatch:
    types: [release-checked-commit]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional full commit SHA (must still be current main in both repositories)'
        required: false
        type: string

permissions:
  contents: read

# Never cancel a release between its backend and frontend deployments.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'hollis-yang/Spec-Virtual-Shanghainese-Learning' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Resolve and verify the requested release
        id: release
        env:
          RELEASE_SHA: ${{ github.event.client_payload.sha || inputs.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release.mjs
  checks:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      repository: ${{ github.repository }}
      sha: ${{ needs.resolve.outputs.sha }}
  deploy:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Recheck the release after tests
        id: release
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release.mjs
      - name: Deploy backend, then frontend, and verify production
        if: steps.release.outputs.ready == 'true'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_SERVICE_ID: srv-db9vmreq1p3s739p3p30
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node scripts/release-production.mjs
