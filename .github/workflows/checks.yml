name: Application checks

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      SPEECH_ENABLE_LIVE: 'false'
      QWEN_ASR_ENABLE_LIVE: 'false'
      QWEN_TTS_ENABLE_LIVE: 'false'
      QWEN_LLM_ENABLE_LIVE: 'false'
      TEXT_INTERPRETER: development_parser
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.lock
      - name: Check application, audio, proxy and database behavior
        run: |
          npm run test:ui
          npm run test:api
          npm run audio:check
          npm run test:deployment-proxy
          npm run test:database-maintenance
          npm run test:git-sync
          npm run test:automation
      - name: Build and verify the pending-acceptance site
        run: npm run build:deployment
