<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Powered Shanghainese Learning Through Virtual Urban Exploration · Spec</title>
<style>
  :root{
    /* 简洁配色：白底 + 湖绿强调 + 深炭文字 */
    --ink:#2c3230;
    --ink-2:#5c6a66;
    --ink-3:#8c9994;
    --line:#e5e5e5;
    --line-strong:#d0d0d0;
    --surface:#ffffff;
    --surface-2:#f6f6f6;
    --surface-3:#d8e8e4;
    --accent:#5a9e98;
    --accent-ink:#3c7c77;
    --accent-soft:#d8e8e4;
    --charcoal:#33403d;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  /* ---------- 阶段条 ---------- */
  .stages{
    display:flex;align-items:stretch;gap:0;
    border:1px solid var(--line);border-radius:var(--radius);
    margin:20px 24px 0;background:var(--surface);overflow-x:auto;
  }
  .stage{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;flex:1;min-width:200px;text-align:left;
    border-radius:var(--radius);
  }
  .stage[aria-current="step"]{background:var(--surface-3)}
  .stage-num{
    flex:none;width:26px;height:26px;border-radius:50%;
    border:1px solid var(--line-strong);color:var(--ink-3);
    display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;
  }
  .stage[aria-current="step"] .stage-num{background:var(--accent);border-color:var(--accent);color:#fff}
  .stage-name{font-weight:600;font-size:14px;line-height:1.3}
  .stage[aria-current="step"] .stage-name{color:var(--accent-ink)}
  .stage-desc{font-size:12px;color:var(--ink-3);line-height:1.4}
  .stage-sep{align-self:center;color:var(--line-strong);padding:0 2px;flex:none}

  /* ---------- 子流程 Tab ---------- */
  .flows{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:18px 24px 14px;border-bottom:1px solid var(--line);
  }
  .flows-label{color:var(--ink-3);font-size:13px;margin-right:10px}
  .flow-tab{
    display:flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;color:var(--ink-2);font-size:13px;
  }
  .flow-tab .k{color:var(--ink-3);font-weight:600}
  .flow-tab:hover{background:var(--surface-2)}
  .flow-tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .flow-tab[aria-selected="true"] .k{color:var(--accent)}
  .flow-arrow{color:var(--line-strong);font-size:12px}

  /* ---------- 布局 ---------- */
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;align-items:start}
  .canvas{padding:24px;min-width:0}
  .inspector{
    position:sticky;top:0;max-height:100vh;overflow-y:auto;
    border-left:1px solid var(--line);background:var(--surface-2);padding:22px 20px 40px;
  }
  @media (max-width:1080px){
    .shell{grid-template-columns:1fr}
    .inspector{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}
  }

  /* ---------- 画布节点 ---------- */
  .canvas-hint{color:var(--ink-3);font-size:12px;margin:0 0 10px}
  .node-source{
    display:flex;align-items:center;gap:14px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  }
  .node-source .glyph{
    flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);
    color:var(--accent);display:grid;place-items:center;font-size:16px;
  }
  .node-source h3{margin:0;font-size:15px}
  .node-source p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
  .node-source .side{margin-left:auto}
  .pill-link{
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    font-size:12px;color:var(--ink-2);background:var(--surface);
  }
  .pill-link:hover{border-color:var(--accent);color:var(--accent-ink)}

  .drop{height:26px;width:2px;background:var(--line-strong);margin:0 auto;position:relative}
  .drop.arrow::after{
    content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--line-strong);
  }

  .node-step,.node-result{
    display:inline-flex;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    padding:10px 16px;font-size:13.5px;
  }
  .node-result{background:var(--surface-2);font-weight:600}
  .center{display:flex;justify-content:center}

  .node-decision{
    display:inline-flex;align-items:center;gap:14px;
    border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);
    border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;
  }
  .node-decision .rhombus{width:13px;height:13px;border:2px solid var(--accent);transform:rotate(45deg);flex:none}
  .node-decision .hint{
    font-weight:400;color:var(--accent-ink);border-left:1px solid rgba(90,158,152,.45);padding-left:14px;font-size:12.5px;
  }

  /* ---------- 分叉 ---------- */
  .fork{display:flex;height:24px}
  .fork > div{position:relative}
  .fork > div::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line-strong)}
  .fork > div::before{content:"";position:absolute;top:0;height:2px;background:var(--line-strong)}
  .fork.down > div:first-child::before{left:50%;right:0}
  .fork.down > div:last-child::before{left:0;right:50%}
  .fork.up > div::before{top:auto;bottom:0}
  .fork.up > div:first-child::before{left:50%;right:0}
  .fork.up > div:last-child::before{left:0;right:50%}

  .paths{display:flex;gap:22px;align-items:stretch}
  .path{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;
  }
  .path-head{display:flex;align-items:center;gap:10px}
  .path-tag{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:2px 8px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  }
  .path-name{font-weight:600;font-size:14px}
  .path-note{color:var(--ink-3);font-size:12px;margin:0}
  .card-row{display:flex;align-items:center;gap:10px;min-width:0}
  .card-row .seq{color:var(--line-strong);flex:none}

  /* ---------- 节点卡 ---------- */
  .card{
    flex:1;min-width:0;text-align:left;display:block;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;transition:border-color .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--line-strong)}
  .card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .card-idx{
    background:var(--surface-3);color:var(--accent-ink);border-radius:5px;
    padding:1px 7px;font-size:11.5px;font-variant-numeric:tabular-nums;
  }
  .card-kind{color:var(--ink-3);font-size:12px}
  .card-open{margin-left:auto;color:var(--ink-3);font-size:13px}
  .card h4{margin:0 0 5px;font-size:15px;line-height:1.4}
  .card .sub{margin:0;color:var(--ink-2);font-size:13px}
  .card hr{border:none;border-top:1px solid var(--line);margin:13px 0 11px}
  .card .out{font-size:12.5px;color:var(--ink-3)}
  .card .out b{color:var(--accent-ink);font-weight:600;margin-left:4px}
  .card .why{margin:9px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .card .why b{color:var(--ink-2);font-weight:600}

  .footnote{color:var(--ink-3);font-size:12px;margin:2px 0 0}
  .tail{
    border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:12px 16px;color:var(--ink-3);font-size:12.5px;margin-top:22px;
  }

  /* ---------- 右侧证据面板 ---------- */
  .insp-crumb{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:12px}
  .insp-crumb .idx{background:var(--surface-3);color:var(--accent-ink);border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .insp h2{margin:10px 0 16px;font-size:19px;line-height:1.35}
  .insp-block{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
  .insp-block:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .insp-h{color:var(--accent-ink);font-weight:600;font-size:13.5px;margin:0 0 8px}
  .insp p{margin:0;color:var(--ink-2);font-size:13px}
  details.more{margin-top:14px}
  details.more summary{
    color:var(--accent-ink);font-size:13px;cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:7px;
  }
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::before{content:"▸";font-size:11px;transition:transform .15s}
  details.more[open] summary::before{transform:rotate(90deg)}
  details.more .body{margin-top:9px;color:var(--ink-2);font-size:12.5px;line-height:1.7}

  .insp-h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .count{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--ink-3);background:var(--surface)}
  .field-label{color:var(--ink-3);font-size:12px;margin:0 0 6px}
  select.trace{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);
    padding:9px 11px;font-size:12.5px;color:var(--ink);
  }
  .meta{color:var(--ink-3);font-size:11.5px;margin:8px 0 0;line-height:1.7}
  .seg{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;margin:14px 0 12px;
  }
  .seg button{flex:1;padding:7px 10px;border-radius:999px;font-size:12.5px;color:var(--ink-2);text-align:center}
  .seg button[aria-selected="true"]{background:var(--surface-3);color:var(--accent-ink);font-weight:600}
  .io{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:13px;margin-bottom:10px}
  .io-tag{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .io-tag .t{background:var(--surface-3);color:var(--accent-ink);border-radius:5px;padding:1px 8px;font-size:11.5px}
  .io-tag .d{color:var(--ink-3);font-size:12px}
  .io-item{background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px}
  .io-item:last-child{margin-bottom:0}
  .io-item.quote{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .io-item h5{margin:0 0 5px;font-size:12.5px}
  .io-item p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
  pre.raw{
    margin:0;background:var(--charcoal);color:#f3ead0;border-radius:var(--radius);
    padding:14px;font-size:11.5px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .empty{color:var(--ink-3);font-size:12.5px}

  /* ---------- 顶栏与语言切换 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 24px 14px;border-bottom:1px solid var(--line);
  }
  .topbar-left{display:flex;flex-direction:column;gap:3px;min-width:0}
  .topbar h1{font-size:14px;font-weight:600;margin:0;color:var(--ink);line-height:1.4}
  .topbar-members{font-size:11.5px;color:var(--ink-3);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg.lang{margin:0;flex:none;width:auto}
  .seg.lang button{flex:none;padding:6px 14px;white-space:nowrap}

  /* ---------- 皮肤微调 ---------- */
  body{background:var(--surface)}
  .stages{box-shadow:0 1px 2px rgba(44,50,48,.04), 0 4px 16px rgba(44,50,48,.05)}
  .card{box-shadow:0 1px 2px rgba(44,50,48,.04)}
  .card:hover{box-shadow:0 2px 4px rgba(44,50,48,.06), 0 8px 20px rgba(44,50,48,.07)}
  .stage-name,.node-source h3,.insp-crumb{letter-spacing:.01em}
  .flow-tab[aria-selected="true"]{background:var(--accent);color:#fff}
  .flow-tab[aria-selected="true"] .k{color:#fff;opacity:.75}
  .seg.lang button[aria-selected="true"]{background:var(--accent);color:#fff}
  .node-source .glyph{border-radius:12px}
  .topbar{background:var(--surface);border-bottom-color:var(--line)}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <h1 id="pageTitle">AI-Powered Shanghainese Learning Through Virtual Urban Exploration · Spec</h1>
    <p class="topbar-members">Haoyang Song (hs2289) &nbsp;·&nbsp; Ruolan Chen (rc975)</p>
  </div>
  <div class="seg lang" id="langSwitch" role="tablist" aria-label="Language / 语言">
    <button role="tab" data-lang="zh" aria-selected="false">中文</button>
    <button role="tab" data-lang="en" aria-selected="true">English</button>
  </div>
</header>

<nav class="stages" id="stages" aria-label="分析阶段（可点击切换）"></nav>

<div class="flows" role="tablist" aria-label="子流程" id="flows">
  <span class="flows-label" id="flowsLabel">流程导航</span>
</div>

<div class="shell">
  <main class="canvas" id="canvas"></main>
  <aside class="inspector insp" id="inspector" aria-live="polite"></aside>
</div>

<script>
/* =========================================================================
   全部内容都在这个 DATA 对象里。改数据即可，下面的渲染逻辑不用动。
   ========================================================================= */
const DATA = {
  /* 顶部阶段条现在可以点击，每个阶段有自己的一组子流程。 */
  activeStage: 1,

  stages: [
    /* ============================================================ 01 背景 */
    {
      num:"01", name:"项目背景", desc:"上海话入门与豫园路线",
      flows: [
        {
          key:"A", name:"入门者缺什么",
          hint:"为什么普通话经验接不上、词表也不够",
          blocks:[
            { type:"source", title:"上海话", meta:"吴语的一支 · 发音、词汇、语法与普通话都不同",
              link:{ label:"查看目标表达范围", href:"#" } },
            { type:"step", title:"词表与发音指南能带到的位置" },
            { type:"decision", title:"入门练习还缺两件东西", hint:"都要补" },
            { type:"branches",
              footnote:"这两件东西决定了项目形态：先有交流目标，再有承载目标的场景，最后才是模型。",
              paths:[
                { tag:"缺口 1", name:"能开口的场合", flex:1, note:"没有场景，表达就没有触发点。", cards:["bg-context"] },
                { tag:"缺口 2", name:"能判定的任务", flex:1, note:"没有完成标准，学习者不知道说到哪算说清楚。", cards:["bg-task"] },
              ]
            },
            { type:"result", title:"以任务为单位、不用到场的练习结构" },
            { type:"note", text:"项目只覆盖入门交流：表达偏好、选择商品、说明数量、确认订单 · 不涉及成段叙述" },
          ],
        },
        {
          key:"B", name:"为什么是豫园",
          hint:"场景怎么反推出 8–12 条核心表达",
          blocks:[
            { type:"source", title:"豫园老城厢", meta:"餐馆 / 点心铺 / 茶楼 · 场景与表达的对应关系明确" },
            { type:"step", title:"从四个场景反推需要的表达" },
            { type:"decision", title:"表达分两批安排", hint:"跨站编排" },
            { type:"branches",
              footnote:"路线全程 20–30 分钟。学习者不需要真的去豫园，场景只用来组织交流目标。",
              paths:[
                { tag:"批次 1", name:"首次出现", flex:1, note:"每站引入一到三条新表达。", cards:["bg-expr-new"] },
                { tag:"批次 2", name:"跨站复现", flex:1, note:"同一条表达在后面的站点再用一次。", cards:["bg-expr-reuse"] },
              ]
            },
            { type:"result", title:"四站固定路线 · 8–12 条核心表达" },
          ],
        },
        {
          key:"C", name:"用现成组件",
          hint:"不训练新模型，拿什么拼出原型",
          blocks:[
            { type:"source", title:"候选组件", meta:"ASR / LLM / TTS 均使用已发布模型 · 不做额外训练" },
            { type:"step", title:"已完成的初步试跑" },
            { type:"decision", title:"三类组件各要回答一个问题", hint:"都要验" },
            { type:"branches",
              footnote:"三类组件的不确定性不同：识别是准不准，合成是像不像，模型与状态机是职责划在哪。吴语适配的 checkpoint 都来自 WenetSpeech-Wu 发布，本项目不训练模型。",
              paths:[
                { tag:"组件 1", name:"识别", flex:1.5, note:"三个候选，含吴语适配版；另有两个发布模型被排除。", cards:["bg-asr-cand","bg-screen"] },
                { tag:"组件 2", name:"合成", flex:1, note:"通用版与吴语微调版对照。", cards:["bg-tts-cand"] },
                { tag:"组件 3", name:"解释与推进", flex:1, note:"模型只做抽取。", cards:["bg-llm"] },
              ]
            },
            { type:"result", title:"可直接拼装的原型组件集" },
          ],
        },
        {
          key:"D", name:"三个研究问题",
          hint:"技术评测与用户研究分别回答什么",
          blocks:[
            { type:"source", title:"研究目标", meta:"speech 模型表现 / 系统可靠性 / 使用体验" },
            { type:"decision", title:"拆成三个可回答的问题", hint:"逐层收窄" },
            { type:"branches",
              footnote:"RQ1 决定用哪套组件，RQ2 决定系统能不能拿去测人，RQ3 才是学习者怎么用。顺序不能倒。",
              paths:[
                { tag:"RQ1", name:"模型比较", flex:1, note:"识别准确率、发音与可懂度。", cards:["rq1-def"] },
                { tag:"RQ2", name:"系统可靠性", flex:1, note:"识别与解释错误如何影响推进。", cards:["rq2-def"] },
                { tag:"RQ3", name:"使用体验", flex:1, note:"入门者怎么用语音与语言支持。", cards:["rq3-def"] },
              ]
            },
            { type:"result", title:"技术评测 + 用户研究两条证据线" },
          ],
        },
      ],
    },

    /* ============================================================ 02 链路 */
    {
      num:"02", name:"系统链路", desc:"看懂一次对话怎么跑完",
      flows: [
        {
          key:"A", name:"路线与任务",
          hint:"学习者走哪几站、每站算什么叫完成",
          blocks:[
            { type:"source", title:"学习者", meta:"18–35 岁 / 零或极少上海话基础 · 本地招募 6–8 人",
              link:{ label:"查看招募标准", href:"#" } },
            { type:"step", title:"入门引导与表达卡预习", link:{ label:"8–12 条核心表达", href:"#" } },
            { type:"decision", title:"任务分两类", hint:"四站都要走" },
            { type:"branches",
              footnote:"四站顺序固定，全程 20–30 分钟。核心表达跨站复现，后一站会用到前一站说过的句子。",
              paths:[
                { tag:"类型 1", name:"偏好与选择", flex:1, note:"只要求说出偏好并确认，先完成一次成功交流。",
                  cards:["a-restaurant","a-candy"] },
                { tag:"类型 2", name:"数量与社交", flex:1, note:"引入数量、外带与复述，最后一站不涉及商品字段。",
                  cards:["a-bun","a-tea"] },

      traces:{ 0:{ label:"1. Definition · how it is computed", model:"Metric definition",

        output:{ 0:{ kind:"Output", desc:"The formula" },

    "ev-latency":{

    "ev-pron":{

      sub:"Share of clips judged free of pronunciation errors by fluent reviewers.",

    "ev-intel":{
      kind:"Metric", title:"Intelligibility",
      sub:"Reviewer ratings from 1 to 5, unintelligible to fully understandable.",
      output:"A rating distribution per TTS model",

      detail:"Two reviewers rate independently; clips where they disagree sharply are listed for a second listen rather than averaged into agreement.",

    "ev-asr-arm":{

      ioTitle:"Conditions and definitions", pickLabel:"Pick a condition",

  zh:{

/* ========================== 以下为渲染逻辑 ========================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 英文覆盖层按下标／键名合并到中文数据上，未覆盖的字段自动回退。 */
function merge(base, over){
  if(over === undefined) return base;
  if(Array.isArray(base)){
    const out = base.slice();
    if(Array.isArray(over)) over.forEach((v,i)=>{ out[i] = merge(base[i], v); });
    else Object.keys(over).forEach(k=>{ out[+k] = merge(base[+k], over[k]); });
    return out;
  }
  if(base && typeof base === 'object'){
    if(!over || typeof over !== 'object') return over;
    const out = Object.assign({}, base);
    Object.keys(over).forEach(k=>{ out[k] = merge(base[k], over[k]); });
    return out;
  }
  return over;
}

let lang = 'en';
let V = merge(DATA, { stages: EN.stages, cards: EN.cards });
let T = UI.en;
let state = { stage: DATA.activeStage, flow: null, card: null, trace: 0, tab: 'preview' };

function setLang(next){
  lang = next;
  T = UI[lang];
  V = lang === 'zh' ? DATA : merge(DATA, { stages: EN.stages, cards: EN.cards });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = T.docTitle;
  $('#pageTitle').textContent = T.pageTitle;
  $('#flowsLabel').textContent = T.flowsLabel;
  $('#stages').setAttribute('aria-label', T.stagesLabel);
  renderLang();
  renderAll();
}

function renderLang(){
  $('#langSwitch').querySelectorAll('[data-lang]').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.lang === lang);
  });
}

const curStage = () => V.stages[state.stage];
const curFlow  = () => curStage().flows.find(f => f.key === state.flow) || curStage().flows[0];

function renderStages(){
  const el = $('#stages');
  el.innerHTML = '';
  V.stages.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'stage';
    if(i === state.stage) b.setAttribute('aria-current','step');
    b.innerHTML = `<span class="stage-num">${esc(s.num)}</span>
      <span><span class="stage-name">${esc(s.name)}</span><br><span class="stage-desc">${esc(s.desc)}</span></span>`;
    b.onclick = () => { state.stage = i; state.flow = V.stages[i].flows[0].key; selectFirstCard(); renderAll(); };
    el.appendChild(b);
    if(i < V.stages.length-1){
      const sep = document.createElement('span');
      sep.className = 'stage-sep'; sep.textContent = '→';
      el.appendChild(sep);
    }
  });
}

function renderFlows(){
  const el = $('#flows');
  el.querySelectorAll('.flow-tab,.flow-arrow').forEach(n=>n.remove());
  const flows = curStage().flows;
  flows.forEach((f,i)=>{
    const b = document.createElement('button');
    b.className = 'flow-tab'; b.role = 'tab';
    b.setAttribute('aria-selected', f.key === curFlow().key);
    b.innerHTML = `<span class="k">${esc(f.key)}</span>${esc(f.name)}`;
    b.onclick = () => { state.flow = f.key; selectFirstCard(); renderAll(); };
    el.appendChild(b);
    if(i < flows.length-1){ const a = document.createElement('span'); a.className='flow-arrow'; a.textContent='→'; el.appendChild(a); }
  });
}

function cardHTML(id){
  const c = V.cards[id];
  if(!c) return `<div class="card"><p class="sub">${esc(T.missingCard)}${esc(id)}</p></div>`;
  return `<button class="card" data-card="${esc(id)}" aria-pressed="${state.card===id}">
    <div class="card-top">
      <span class="card-idx">${esc(c.idx)}</span>
      <span class="card-kind">${esc(c.kind)}</span>
      <span class="card-open">↗</span>
    </div>
    <h4>${esc(c.title)}</h4>
    <p class="sub">${esc(c.sub)}</p>
    <hr>
    <div class="out">${esc(T.outLabel)}<b>${esc(c.output)}</b></div>
    <p class="why"><b>${esc(T.whyLabel)}</b>${esc(c.why)}</p>
  </button>`;
}

function blockHTML(b){
  switch(b.type){
    case 'source':
      return `<div class="node-source">
        <span class="glyph">☰</span>
        <span><h3>${esc(b.title)}</h3>${b.meta?`<p>${esc(b.meta)}</p>`:''}</span>
        ${b.link?`<span class="side"><a class="pill-link" href="${esc(b.link.href||'#')}">${esc(b.link.label)} ↗</a></span>`:''}
      </div><div class="drop arrow"></div>`;
    case 'step':
      return `<div class="center"><div class="node-step">${esc(b.title)}
        ${b.link?`<a class="pill-link" href="${esc(b.link.href||'#')}">${esc(b.link.label)} ↗</a>`:''}
      </div></div><div class="drop arrow"></div>`;
    case 'decision':
      return `<div class="center"><div class="node-decision">
        <span class="rhombus"></span>${esc(b.title)}<span class="hint">${esc(b.hint||'')}</span>
      </div></div>`;
    case 'result':
      return `<div class="center"><div class="node-result">${esc(b.title)}
        ${b.link?`<a class="pill-link" href="${esc(b.link.href||'#')}">${esc(b.link.label)} ↗</a>`:''}
      </div></div>`;
    case 'note':
      return `<div class="tail">${esc(b.text)}</div>`;
    case 'branches': {
      const fork = dir => `<div class="fork ${dir}">${b.paths.map(p=>`<div style="flex:${p.flex||1}"></div>`).join('')}</div>`;
      const paths = b.paths.map(p=>`
        <section class="path" style="flex:${p.flex||1}">
          <div class="path-head"><span class="path-tag">${esc(p.tag)}</span><span class="path-name">${esc(p.name)}</span></div>
          <div class="card-row">${p.cards.map(cardHTML).join('<span class="seq">→</span>')}</div>
          ${p.note?`<p class="path-note">${esc(p.note)}</p>`:''}
        </section>`).join('');
      return `${fork('down')}<div class="paths">${paths}</div>
        ${b.footnote?`<p class="footnote">${esc(b.footnote)}</p>`:''}
        ${fork('up')}`;
    }
    default: return '';
  }
}

function renderCanvas(){
  const flow = curFlow();
  $('#canvas').innerHTML =
    (flow.hint?`<p class="canvas-hint">▸ ${esc(flow.hint)}</p>`:'') +
    flow.blocks.map(blockHTML).join('');
  $('#canvas').querySelectorAll('[data-card]').forEach(btn=>{
    btn.onclick = () => { state.card = btn.dataset.card; state.trace = 0; state.tab = 'preview'; renderAll(); };
  });
}

function ioHTML(items){
  if(!items || !items.length) return `<p class="empty">${esc(T.noRecord)}</p>`;
  const head = items[0].kind ? items[0] : null;
  const body = head ? items.slice(1) : items;
  return `<div class="io">
    ${head?`<div class="io-tag"><span class="t">${esc(head.kind)}</span><span class="d">${esc(head.desc||'')}</span></div>`:''}
    ${body.map(i=>`<div class="io-item${i.quote?' quote':''}">
      ${i.title?`<h5>${esc(i.title)}</h5>`:''}<p>${esc(i.text)}</p></div>`).join('')}
  </div>`;
}

function renderInspector(){
  const c = V.cards[state.card];
  const box = $('#inspector');
  if(!c){ box.innerHTML = `<p class="empty">${esc(T.emptyInspector)}</p>`; return; }
  const traces = c.traces || [];
  const t = traces[state.trace];
  const ioTitle   = c.ioTitle   || T.ioTitle;
  const pickLabel = c.pickLabel || T.pickLabel;
  const emptyText = c.emptyText || T.emptyTrace;

  box.innerHTML = `
    <div class="insp-crumb"><span class="idx">${esc(c.idx)}</span>${esc(c.kind)}</div>
    <h2>${esc(c.title)}</h2>

    <div class="insp-block">
      <p class="insp-h">${esc(T.whyHead)}</p>
      <p>${esc(c.why)}</p>
      ${c.detail?`<details class="more"><summary>${esc(T.moreSummary)}</summary>
        <div class="body">${esc(c.detail)}</div></details>`:''}
    </div>

    <div class="insp-block">
      <div class="insp-h-row">
        <p class="insp-h" style="margin:0">${esc(ioTitle)}</p>
        <span class="count">${esc(T.countAll(traces.length))}</span>
      </div>
      ${traces.length ? `
        <p class="field-label">${esc(pickLabel)}</p>
        <select class="trace" id="traceSel" aria-label="${esc(pickLabel)}">
          ${traces.map((x,i)=>`<option value="${i}" ${i===state.trace?'selected':''}>${esc(x.label)}</option>`).join('')}
        </select>
        <p class="meta">${esc(t.model)}<br>${esc(t.time)}</p>
        <div class="seg" role="tablist">
          <button role="tab" data-tab="preview" aria-selected="${state.tab==='preview'}">${esc(T.tabPreview)}</button>
          <button role="tab" data-tab="raw" aria-selected="${state.tab==='raw'}">${esc(T.tabRaw)}</button>
        </div>
        ${state.tab==='preview'
          ? ioHTML(t.input) + ioHTML(t.output)
          : `<pre class="raw">${esc(t.raw||T.noRaw)}</pre>`}
      ` : `<p class="empty">${esc(emptyText)}</p>`}
  `;

  const sel = $('#traceSel');
  if(sel) sel.onchange = e => { state.trace = +e.target.value; renderInspector(); };
  box.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = () => { state.tab = b.dataset.tab; renderInspector(); };
  });
}

function selectFirstCard(){
  const flow = curFlow();
  state.flow = flow.key;
  const br = flow.blocks.find(b => b.type === 'branches');
  state.card = br ? br.paths[0].cards[0] : null;
  state.trace = 0; state.tab = 'preview';
}

function renderAll(){ renderStages(); renderFlows(); renderCanvas(); renderInspector(); }

$('#langSwitch').querySelectorAll('[data-lang]').forEach(b=>{
  b.onclick = () => setLang(b.dataset.lang);
});

selectFirstCard();
setLang('zh');
</script>
